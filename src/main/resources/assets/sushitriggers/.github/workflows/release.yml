name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 1.0.1)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.8.2
      - name: Set version
        run: sed -i "s/^mod_version=.*/mod_version=${{ inputs.version }}/" gradle.properties
      - run: gradle build --no-daemon
      - name: Find jar
        run: echo "JAR=$(ls build/libs/*.jar | grep -v -e sources -e dev | head -1)" >> "$GITHUB_ENV"
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: SushiTriggers ${{ inputs.version }} (Fabric 26.2)
          body: SushiTriggers ${{ inputs.version }} for Minecraft 26.2
          files: ${{ env.JAR }}
          make_latest: true
