name: Build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.0.1). Leave empty for a build without a release."
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.8.2
      - name: Set version
        if: github.event_name == 'workflow_dispatch' && inputs.version != ''
        run: sed -i "s/^mod_version=.*/mod_version=${{ inputs.version }}/" gradle.properties
      - run: gradle build --no-daemon
      - name: Find jar
        run: echo "JAR=$(ls build/libs/*.jar | grep -v -e sources -e dev | head -1)" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: sushitriggers-fabric-26.2
          path: ${{ env.JAR }}
      - name: Publish release
        if: github.event_name == 'workflow_dispatch' && inputs.version != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: SushiTriggers ${{ inputs.version }} (Fabric 26.2)
          body: SushiTriggers ${{ inputs.version }} for Minecraft 26.2
          files: ${{ env.JAR }}
          make_latest: true
